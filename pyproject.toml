[project]
name = "zephyrwerk-platform"
version = "0.1.0"
description = "Production-grade energy analytics platform: SMARD ingestion → dbt → FastAPI → Streamlit → AWS"
readme = "README.md"
requires-python = ">=3.11"

# Base deps are only what every image needs: db/ (imported by api, ingestion
# and ml) pulls in psycopg2 + pydantic-settings, and all three use pandas.
# Everything else lives in a per-image extra so each Dockerfile installs
# ".[<image>]" instead of the whole stack. Local dev gets everything via the
# dev extra (`uv sync --extra dev`).
dependencies = [
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.3",
    # api/main.py and orchestration/run_pipeline.py import dotenv directly
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    # The api imports ml.training_utils / ml.s3_model_io (xgboost + sklearn at
    # import time) and joblib-unpickles the trained pipelines from S3, which
    # needs every class inside them importable.
    "boto3>=1.34",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    # xgboost-cpu drops the ~350 MB nvidia-nccl wheel plain xgboost pulls on
    # Linux (incl. the arm64 ECS images), but ships no macOS wheels, so the
    # Mac dev env keeps plain xgboost. Both provide the same `xgboost` module.
    "xgboost-cpu; sys_platform == 'linux'",
    "xgboost; sys_platform != 'linux'",
]
ingestion = [
    "requests>=2.32",
    "pyarrow>=16.0",
    "boto3>=1.34",
]
ml = [
    "sqlalchemy>=2.0",
    "boto3>=1.34",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    # xgboost-cpu drops the ~350 MB nvidia-nccl wheel plain xgboost pulls on
    # Linux (incl. the arm64 ECS images), but ships no macOS wheels, so the
    # Mac dev env keeps plain xgboost. Both provide the same `xgboost` module.
    "xgboost-cpu; sys_platform == 'linux'",
    "xgboost; sys_platform != 'linux'",
    # training_utils.draw_predictions saves holdout plots during training
    "matplotlib>=3.9",
]
# Not used by dashboard/Dockerfile (it installs dashboard/requirements.txt);
# this is for running the dashboard locally.
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.22",
    "requests>=2.32",
]
# Local orchestration (orchestration/run_pipeline.py shells out to dbt) and
# dbt/seeds/holiday_seeder.py. The dbt image pins its own versions.
pipeline = [
    "holidays>=0.46",
    "dbt-core>=1.7",
    "dbt-postgres>=1.7",
]
dev = [
    "zephyrwerk-platform[api,ingestion,ml,dashboard,pipeline]",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "jupyterlab>=4.5",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "orchestration", "ml", "api", "dashboard", "db"]
