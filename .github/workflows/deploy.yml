name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::311160247861:role/zephyrwerk-github-action

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: [api, dashboard, ingestion, dbt, ml]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: tag
        run: echo "sha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/zephyrwerk-${{ matrix.service }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task definition revisions
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com
          
          TARGETS=(
            "zephyrwerk-init-db:ingestion"
            "zephyrwerk-ingestion-smard:ingestion"
            "zephyrwerk-ingestion-weather:ingestion"
            "zephyrwerk-ingestion-weather_forecast:ingestion"
            "zephyrwerk-ingestion-load:ingestion"
            "zephyrwerk-dbt:dbt"
            "zephyrwerk-ml-price:ml"
            "zephyrwerk-ml-generation:ml"
            "zephyrwerk-api:api"
            "zephyrwerk-dashboard:dashboard"
          )

          # family → ECR deposu eşlemesi
          for TARGET in "${TARGETS[@]}"; do
            FAMILY="${TARGET%%:*}"
            REPO="${TARGET##*:}"
            echo "--- $FAMILY -> zephyrwerk-$REPO:$SHA"

            aws ecs describe-task-definition --task-definition "$FAMILY" \
              --query 'taskDefinition' --output json > current.json

            jq --arg img "$REGISTRY/zephyrwerk-$REPO:$SHA" '
              .containerDefinitions[0].image = $img
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
            ' current.json > new.json

            aws ecs register-task-definition --cli-input-json file://new.json \
              --query 'taskDefinition.taskDefinitionArn' --output text

          done <<'EOF'
          zephyrwerk-init-db                 ingestion
          zephyrwerk-ingestion-smard         ingestion
          zephyrwerk-ingestion-weather       ingestion
          zephyrwerk-ingestion-weather_forecast  ingestion
          zephyrwerk-ingestion-load          ingestion
          zephyrwerk-dbt                     dbt
          zephyrwerk-ml-price                ml
          zephyrwerk-ml-generation           ml
          zephyrwerk-api                     api
          zephyrwerk-dashboard               dashboard
          EOF

      - name: Update services
        run: |
          for SERVICE in zephyrwerk-api zephyrwerk-dashboard; do
            aws ecs update-service \
              --cluster zephyrwerk-cluster \
              --service "$SERVICE" \
              --task-definition "$SERVICE" \
              --query 'service.taskDefinition' --output text
          done