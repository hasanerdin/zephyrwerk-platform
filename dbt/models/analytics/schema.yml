      - name: shortwave_radiation_brandenburg
        description: "Forecasted downward shortwave solar radiation in W/m² for wind_region_brandenburg."

      - name: cloud_cover_brandenburg
        description: "Forecasted total cloud cover as a percentage (0-100) for wind_region_brandenburg."

      - name: temperature_2m_brandenburg
        description: "Forecasted air temperature at 2 m above ground in °C for wind_region_brandenburg."

      - name: wind_speed_100m_schleswig
