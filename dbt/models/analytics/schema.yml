      - name: temperature_2m_bawue
        description: "Air temperature at 2 m above ground in °C for solar_region_bawue."

  - name: fct_weather_forecast_features
    description: "Pivoted fact table of hourly forecasted weather signals at 100 m hub height and surface level,
